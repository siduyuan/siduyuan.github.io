<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello, GitHub Pages</title>
  <style>
    :root {
      color-scheme: light dark;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f6f8fa;
      color: #24292f;
      text-align: center;
    }
    main {
      padding: 2rem;
    }
    h1 {
      font-size: 3rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
    }
    p {
      font-size: 1.25rem;
      color: #57606a;
    }
  </style>
</head>
<body>
  <main>
    <h1>Hello, World!</h1>
    <p>这是一张由 GitHub Pages 托管的最小静态页面。</p>
  </main>
</body>
</html>
