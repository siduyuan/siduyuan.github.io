<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>思渡鸢 SiDuYuan</title>
  <meta name="description" content="欢迎来到思渡鸢(SiDuYuan)的主页">
  <style>
    :root {
      --bg: #0f1220;
      --text: #eef1f7;
      --muted: #9aa3b8;
      --accent1: #6d5dfc;
      --accent2: #22d3ee;
      --card: rgba(255, 255, 255, 0.06);
      --card-border: rgba(255, 255, 255, 0.12);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 600px at 20% 0%, rgba(109, 93, 252, 0.35), transparent 60%),
        radial-gradient(1000px 500px at 100% 100%, rgba(34, 211, 238, 0.25), transparent 60%),
        var(--bg);
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: 100%;
      max-width: 520px;
    }

    .avatar {
      width: 84px;
      height: 84px;
      margin: 0 auto 1.5rem;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.4rem;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, var(--accent1), var(--accent2));
      box-shadow: 0 0 0 6px rgba(255, 255, 255, 0.06), 0 12px 32px rgba(109, 93, 252, 0.4);
    }

    h1 {
      font-size: clamp(1.9rem, 5vw, 2.6rem);
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 0.6rem;
    }

    .subtitle {
      font-size: 1.05rem;
      color: var(--muted);
      margin-bottom: 2.5rem;
    }

    .links {
      display: grid;
      gap: 0.9rem;
    }

    .links a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1.1rem 1.4rem;
      border-radius: 14px;
      background: var(--card);
      border: 1px solid var(--card-border);
      color: var(--text);
      text-decoration: none;
      font-size: 1.05rem;
      transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
    }

    .links a:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(109, 93, 252, 0.6);
    }

    .links .label {
      font-weight: 600;
    }

    .links .meta {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .links .arrow {
      flex-shrink: 0;
      color: var(--muted);
      font-size: 1.1rem;
      transition: transform 0.18s ease, color 0.18s ease;
    }

    .links a:hover .arrow {
      transform: translateX(3px);
      color: var(--accent2);
    }

    footer {
      margin-top: 2.5rem;
      font-size: 0.82rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <div class="avatar" aria-hidden="true">鸢</div>
    <h1>欢迎来到思渡鸢的主页</h1>
    <p class="subtitle">SiDuYuan · 欢迎光临</p>

    <nav class="links" aria-label="导航">
      <a href="https://blog.sdy20h.cn" rel="noopener">
        <span class="label">去我的博客</span>
        <span class="meta">blog.sdy20h.cn</span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
      <a href="https://hello.sdy20h.cn" rel="noopener">
        <span class="label">去我的导航首页</span>
        <span class="meta">hello.sdy20h.cn</span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </nav>

    <footer>© 2026 SiDuYuan</footer>
  </main>
</body>
</html>
